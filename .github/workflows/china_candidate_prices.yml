name: Private Mainland and Hong Kong ETF closing prices

on:
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: Scheduled UTC time supplied by the Cloudflare Worker
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-closing-price-snapshot
  queue: max
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
          persist-credentials: false
      - name: Check existing private delivery configuration
        env:
          CHINA_PRIVATE_OBJECT_TRANSFER: ${{ vars.CHINA_PRIVATE_OBJECT_TRANSFER }}
        run: |
          if [ "$CHINA_PRIVATE_OBJECT_TRANSFER" != publish ]; then
            echo "::error::Existing private China delivery is not enabled for this runner."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install collection and private delivery dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect missing complete sessions and publish privately
        env:
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
          CHINA_PRIVATE_OBJECT_TRANSFER: ${{ vars.CHINA_PRIVATE_OBJECT_TRANSFER }}
          CHINA_PRIVATE_S3_REGION: ${{ vars.CHINA_PRIVATE_S3_REGION || secrets.CHINA_PRIVATE_S3_REGION }}
          CHINA_PRIVATE_S3_BUCKET: ${{ vars.CHINA_PRIVATE_S3_BUCKET || secrets.CHINA_PRIVATE_S3_BUCKET }}
          CHINA_PRIVATE_S3_PREFIX: ${{ vars.CHINA_PRIVATE_S3_PREFIX || secrets.CHINA_PRIVATE_S3_PREFIX }}
          CHINA_PRIVATE_S3_OWNER: ${{ vars.CHINA_PRIVATE_S3_OWNER || secrets.CHINA_PRIVATE_S3_OWNER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_china_hong_kong_prices.py
      - name: Verify tracked prices were untouched
        if: always()
        run: git diff --exit-code HEAD -- data/
