name: China mainland ETF candidate price observation

on:
  push:
    branches: ["data-validation-mvp"]
    paths:
      # Only edits to the symbol manifest request a new KIS observation batch.
      # Review-status edits, code fixes, and workflow edits do not call KIS.
      - "data/china_candidate_observation_manifest.csv"
  schedule:
    # 07:00 KST Monday-Saturday, aligned with the other country candidate-price refreshes.
    # Isolated scheduled request batch; no manual dispatch to avoid accidental live API tests.
    - cron: "0 22 * * 0-5"

permissions:
  contents: write

concurrency:
  # KIS requests share rate limits with the active snapshot and stock discovery.
  group: daily-closing-price-snapshot
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch inactive mainland China ETF candidates (30 symbols)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_china_candidate_prices.py
      - name: Commit isolated observation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/china_candidate_prices.csv data/china_candidate_prices_status.json
          if git diff --cached --quiet; then
            echo "China candidate observation unchanged."
            exit 0
          fi
          git commit -m "Refresh isolated China ETF candidate price observations"
          for attempt in 1 2 3 4 5; do
            git fetch origin data-validation-mvp
            if ! git rebase origin/data-validation-mvp; then
              git rebase --abort || true
              echo "Concurrent update conflict; retrying ($attempt/5)."
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:data-validation-mvp; then
              echo "China candidate observation committed."
              exit 0
            fi
            echo "Concurrent target-branch update; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "Could not publish China candidate observation after 5 retries." >&2
          exit 1
