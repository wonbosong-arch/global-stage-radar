name: Candidate stock discovery

on:
  schedule:
    # 08:00 KST Monday-Saturday; KIS concurrency serializes collection with price refreshes. Skip Sunday KST.
    - cron: "0 23 * * 0-5"
  workflow_dispatch:
  push:
    branches: ["data-validation-mvp"]
    paths:
      - ".github/workflows/candidate_collection.yml"
      - ".github/workflows/candidate_prices_manual.yml"
      - "collect_stock_candidates.py"
      - "intake_large_cap_review_candidates.py"
      - "stock_mapping.py"
      - "kis_provider.py"
      - "kis_universe.py"
      - "krx_master.py"
      - "yahoo_market_cap_supplement.py"
      - "yahoo_market_cap_reconciliation.py"

permissions:
  actions: write
  contents: write

concurrency:
  # Serialize KIS-consuming collection jobs with the daily/candidate price snapshots.
  # KIS rate limits are shared across these workflows; independent review/code tasks remain parallel.
  group: daily-closing-price-snapshot
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Discover pending stock candidates
        id: discover
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          USD_KRW_RATE: ${{ vars.USD_KRW_RATE }}
        run: python collect_stock_candidates.py
      - name: Add a bounded batch from the secondary large-cap review queue
        id: large_cap_intake
        if: steps.discover.outcome == 'success'
        run: python intake_large_cap_review_candidates.py
      - name: Determine whether discovery added new candidates
        id: candidate_delta
        if: steps.discover.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          status = json.loads(Path("data/candidate_collection_status.json").read_text(encoding="utf-8"))
          total_added = int(status.get("new_candidates_added", 0) or 0) + int(status.get("large_cap_review_candidates_added", 0) or 0)
          print(f"new_candidates_added={total_added}")
          PY
      # Yahoo Finance market-cap supplements and reconciliation are owned by
      # candidate_coverage_report.yml to avoid concurrent commits to shared evidence files.
      - name: Commit candidate additions and collection status
        id: commit_candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_universe_candidates.csv data/candidate_collection_status.json data/unranked_us_stock_master.csv
          if git diff --cached --quiet; then
            echo "No candidate list or status changes."
            exit 0
          fi
          git commit -m "Refresh pending stock candidate discovery"
          for attempt in 1 2 3 4 5; do
            git fetch origin data-validation-mvp
            git rebase origin/data-validation-mvp
            if git push origin HEAD:data-validation-mvp; then
              echo "Candidate discovery result committed."
              exit 0
            fi
            echo "Concurrent target-branch update; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "Could not publish candidate discovery result after 5 retries." >&2
          exit 1
      - name: Trigger candidate coverage report after successful discovery
        if: always() && steps.discover.outcome == 'success' && steps.commit_candidate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GH_REPO}/actions/workflows/candidate_coverage_report.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"data-validation-mvp"}'
          echo "Dispatched candidate coverage report on data-validation-mvp."
      - name: Trigger pending-candidate price refresh after successful discovery
        if: steps.discover.outcome == 'success' && steps.candidate_delta.outputs.new_candidates_added != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GH_REPO}/actions/workflows/candidate_prices_manual.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"data-validation-mvp"}'
          echo "Dispatched candidate price refresh on data-validation-mvp."
      - name: Mark discovery failure as workflow failure
        if: always() && steps.discover.outcome != 'success'
        run: |
          echo "Candidate discovery failed; see the Discover pending stock candidates step and data/candidate_collection_status.json." >&2
          exit 1
