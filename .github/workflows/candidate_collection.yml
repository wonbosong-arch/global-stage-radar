name: Candidate stock discovery

on:
  schedule:
    # 07:30 KST Tuesday-Saturday; collect before the 08:00 price snapshot. Skip Sunday and Monday KST.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: ["data-validation-mvp"]
    paths:
      - ".github/workflows/candidate_collection.yml"
      - "collect_stock_candidates.py"
      - "kis_provider.py"
      - "kis_universe.py"
      - "krx_master.py"
      - "yahoo_market_cap_supplement.py"
      - "yahoo_market_cap_reconciliation.py"

permissions:
  contents: write

concurrency:
  group: candidate-stock-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Discover pending stock candidates
        id: discover
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          USD_KRW_RATE: ${{ vars.USD_KRW_RATE }}
        run: python collect_stock_candidates.py
      - name: Collect secondary Yahoo Finance market-cap observations
        id: yahoo
        if: steps.discover.outcome == 'success'
        run: python yahoo_market_cap_supplement.py
      - name: Compare secondary market-cap sources for manual triage
        id: reconcile
        if: steps.discover.outcome == 'success' && steps.yahoo.outcome == 'success'
        run: python yahoo_market_cap_reconciliation.py
      - name: Commit candidate additions and secondary market-cap observations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_universe_candidates.csv data/candidate_collection_status.json
          if [ -f data/yahoo_market_cap_supplement.csv ]; then git add data/yahoo_market_cap_supplement.csv; fi
          if [ "${{ steps.reconcile.outcome }}" = "success" ] && [ -f data/yahoo_market_cap_reconciliation.csv ]; then
            git add data/yahoo_market_cap_reconciliation.csv
          fi
          if git diff --cached --quiet; then
            echo "No candidate list or status changes."
            exit 0
          fi
          git commit -m "Refresh pending stock candidate discovery"
          for attempt in 1 2 3 4 5; do
            git fetch origin data-validation-mvp
            git rebase origin/data-validation-mvp
            if git push origin HEAD:data-validation-mvp; then
              echo "Candidate discovery result committed."
              exit 0
            fi
            echo "Concurrent target-branch update; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "Could not publish candidate discovery result after 5 retries." >&2
          exit 1
