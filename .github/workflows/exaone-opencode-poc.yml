name: EXAONE OpenCode isolated coding PoC

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Preapproved, review-only coding task"
        type: choice
        required: true
        default: ticker-smoke
        options:
          - ticker-smoke
          - exaone-regression-tests
      live:
        description: "Call EXAONE only after explicit approval"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: exaone-opencode-poc
  cancel-in-progress: false

jobs:
  generate-candidate:
    if: ${{ !inputs.live || github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify config and prepare restricted scratch workspace
        shell: bash
        env:
          AGENT_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python -X utf8 automation/exaone-opencode-poc/runner.py check
          python -X utf8 automation/exaone-opencode-poc/runner.py prepare \
            --task "$AGENT_TASK" --workspace "$RUNNER_TEMP/exaone-poc"

      - name: Install fixed-version OpenCode
        if: ${{ inputs.live }}
        run: |
          npm install --global @opencode/cli@2.2.6
          opencode --version

      - name: Run isolated EXAONE coding task (no repository write access)
        if: ${{ inputs.live }}
        shell: bash
        working-directory: ${{ runner.temp }}/exaone-poc
        env:
          EXAONE_API_KEY: ${{ secrets.EXAONE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$EXAONE_API_KEY"
          # OpenCode has no shell, network, external-directory or subagent tool permission.
          # stdout/stderr can contain model output and must not be printed to CI logs.
          status=0
          timeout 180s opencode run --standalone --model exaone/k-exaone_v2.5 \
            --agent build "$(cat task.txt)" > "$RUNNER_TEMP/opencode-session.log" 2>&1 || status=$?
          if [[ "$status" -eq 124 ]]; then
            echo "Agent reached the 180-second timeout." >&2
          elif [[ "$status" -ne 0 ]]; then
            echo "Agent exited with a nonzero status: $status." >&2
          fi
          if [[ "$status" -ne 0 ]]; then
            if [[ -s tests/test_exaone_sector_pilot_agent.py || -s ticker_utils.py ]]; then
              echo "A candidate file exists but is unverified; nothing will be published." >&2
            else
              echo "No generated candidate file detected." >&2
            fi
            exit 1
          fi
          echo "Agent command exited successfully."

      - name: Validate produced review artifact without executing model code
        if: ${{ inputs.live }}
        shell: bash
        env:
          AGENT_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          python -X utf8 automation/exaone-opencode-poc/runner.py verify \
            --task "$AGENT_TASK" --workspace "$RUNNER_TEMP/exaone-poc"
          mkdir -p "$RUNNER_TEMP/exaone-result"
          case "$AGENT_TASK" in
            ticker-smoke)
              cp -- "$RUNNER_TEMP/exaone-poc/ticker_utils.py" "$RUNNER_TEMP/exaone-result/ticker_utils.py"
              ;;
            exaone-regression-tests)
              cp -- "$RUNNER_TEMP/exaone-poc/tests/test_exaone_sector_pilot_agent.py" \
                "$RUNNER_TEMP/exaone-result/test_exaone_sector_pilot_agent.py"
              ;;
            *) echo "Unknown task" >&2; exit 1 ;;
          esac

      - name: Save unverified candidate code for separate validation
        if: ${{ inputs.live && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: exaone-opencode-unverified-candidate
          path: ${{ runner.temp }}/exaone-result/
          if-no-files-found: error
          retention-days: 1

  verify-behavior:
    name: Verify generated behavior without API key
    needs: generate-candidate
    if: ${{ inputs.live && needs['generate-candidate'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out only trusted verifier and reference source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download untrusted candidate
        uses: actions/download-artifact@v4
        with:
          name: exaone-opencode-unverified-candidate
          path: ${{ runner.temp }}/exaone-unverified

      - name: Prepare minimal readonly verification inputs
        shell: bash
        env:
          AGENT_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exaone-review/tests/fixtures"
          case "$AGENT_TASK" in
            ticker-smoke)
              cp -- "$RUNNER_TEMP/exaone-unverified/ticker_utils.py" "$RUNNER_TEMP/exaone-review/ticker_utils.py"
              ;;
            exaone-regression-tests)
              cp -- "$RUNNER_TEMP/exaone-unverified/test_exaone_sector_pilot_agent.py" \
                "$RUNNER_TEMP/exaone-review/tests/test_exaone_sector_pilot_agent.py"
              cp -- exaone_sector_pilot.py stock_mapping.py "$RUNNER_TEMP/exaone-review/"
              cp -- tests/fixtures/exaone_sector_samples.json "$RUNNER_TEMP/exaone-review/tests/fixtures/"
              ;;
            *)
              echo "Unapproved task" >&2; exit 1 ;;
          esac

      - name: Execute behavior checks in networkless read-only container
        shell: bash
        env:
          AGENT_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          # This job has NO EXAONE_API_KEY. The generated code runs only inside
          # Docker with no network, no host credentials and read-only mounts.
          timeout 60s docker run --rm -i \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --memory 256m --cpus 1 --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            -v "$RUNNER_TEMP/exaone-review:/work:ro" \
            -v "$GITHUB_WORKSPACE/automation/exaone-opencode-poc/behavior_check.py:/verify/behavior_check.py:ro" \
            --workdir /work python:3.11-slim \
            python -I -B /verify/behavior_check.py --task "$AGENT_TASK"

      - name: Publish verified source only on behavioral success
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: exaone-opencode-verified-code
          path: ${{ runner.temp }}/exaone-unverified/
          retention-days: 3
          if-no-files-found: error
