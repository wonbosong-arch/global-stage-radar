name: Chart browser regression

on:
  pull_request:
    branches: [data-validation-mvp]
    paths:
      - app.py
      - ui_shell.py
      - chart_interactions.*
      - requirements.txt
      - browser_checks/**
      - .github/workflows/chart-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies and browser
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Check rendered chart contracts
        run: python browser_checks/check_price_chart.py
      - name: Check synchronized dashboard controls and scroll position
        run: python browser_checks/check_dashboard_navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-browser-results
          path: artifacts/
