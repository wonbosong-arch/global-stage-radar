name: Chart browser regression

on:
  pull_request:
    branches: [data-validation-mvp]
    paths:
      - app.py
      - china_market_explorer.py
      - market_etf_menu.py
      - ui_shell.py
      - analysis_theme.css
      - briefing_fidelity.css
      - weekly_briefing.*
      - chart_ui.py
      - asset_table.*
      - .streamlit/config.toml
      - favorite_assets.py
      - favorite_storage.js
      - dashboard_ui.py
      - nasdaq_private_review.py
      - nasdaq_web_upload.py
      - nasdaq_github_store.py
      - tests/test_nasdaq*.py
      - analysis_preferences.py
      - preference_storage.js
      - list_keyboard.js
      - grid_paging.js
      - chart_interactions.*
      - us_research_chart_identity.py
      - us_research_dashboard.py
      - requirements.txt
      - browser_checks/**
      - .github/workflows/chart-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-browser:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [chart-browser, saved-research-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies and browser
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Check rendered chart contracts
        if: matrix.scenario == 'chart-browser'
        run: python browser_checks/check_price_chart.py
      - name: Check synchronized dashboard controls and scroll position
        if: matrix.scenario == 'chart-browser'
        run: python browser_checks/check_dashboard_navigation.py --demo-only
      - name: Check saved research charts, search and selection
        if: matrix.scenario == 'saved-research-browser'
        run: python browser_checks/check_dashboard_navigation.py --research-only
      - name: Check full hosting-frame reload and browser preference restoration
        if: matrix.scenario == 'chart-browser'
        run: python browser_checks/check_embedded_reload.py
      - name: Check Nasdaq upload and approval with a fake GitHub store
        if: matrix.scenario == 'chart-browser'
        run: python browser_checks/check_nasdaq_upload.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.scenario }}-results
          path: artifacts/
