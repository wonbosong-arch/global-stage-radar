name: Dispatch target-branch candidate coverage report

on:
  schedule:
    # 09:00 KST Monday-Saturday = 00:00 UTC Monday-Saturday.
    - cron: "0 0 * * 1-6"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch candidate coverage report on data-validation-mvp
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GH_REPO}/actions/workflows/candidate_coverage_report.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"data-validation-mvp"}'
          echo "Dispatched candidate_coverage_report.yml on data-validation-mvp."
