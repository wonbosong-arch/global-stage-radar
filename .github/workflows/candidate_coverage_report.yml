name: Candidate coverage report

on:
  schedule:
    # Fallback refresh at 09:00 KST Monday-Saturday; skip Sunday.
    - cron: "0 0 * * 1-6"
  workflow_dispatch:
  workflow_run:
    workflows: ["Manual pending-candidate price review v5"]
    types: [completed]
    branches: [main]
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/candidate_coverage_report.yml"
      - "candidate_coverage_audit.py"
      - "candidate_identity_evidence_audit.py"
      - "candidate_market_cap_reconciliation.py"
      - "data/stock_universe_candidates.csv"
      - "data/daily_prices.csv"
      - "data/monitoring_universe.csv"

permissions:
  contents: write

concurrency:
  group: candidate-coverage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Regenerate and commit reports with race-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Report commit attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            python candidate_coverage_audit.py
            python candidate_identity_evidence_audit.py
            python candidate_market_cap_reconciliation.py

            git add data/stock_candidate_coverage_report.csv data/candidate_identity_evidence_coverage.csv data/candidate_market_cap_reconciliation.csv
            if git diff --cached --quiet; then
              echo "Candidate reports already current."
              exit 0
            fi

            git commit -m "Refresh pending candidate coverage report"
            if git push origin HEAD:main; then
              echo "Candidate reports committed successfully."
              exit 0
            fi

            echo "Concurrent main-branch update detected; regenerate from latest main and retry."
            sleep "$((attempt * 2))"
          done

          echo "Could not publish reports after 5 retries." >&2
          exit 1
