name: Candidate coverage report

on:
  schedule:
    # Fallback refresh at 09:00 KST Monday-Saturday; skip Sunday.
    - cron: "0 0 * * 1-6"
  workflow_dispatch:
    inputs:
      report_ref:
        description: "Branch to regenerate and commit reports to (main or candidate review branch)"
        required: true
        default: "candidate-source-provenance"
        type: string
  workflow_run:
    workflows: ["Manual pending-candidate price review v5"]
    types: [completed]
    branches: [main]
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/candidate_coverage_report.yml"
      - "candidate_coverage_audit.py"
      - "candidate_identity_evidence_audit.py"
      - "candidate_market_cap_reconciliation.py"
      - "candidate_review_queue.py"
      - "candidate_provider_observation_audit.py"
      - "tests/test_candidate_provider_observation_audit.py"
      - "tests/test_candidate_review_queue.py"
      - "tests/test_report_freshness.py"
      - "data/stock_universe_candidates.csv"
      - "data/daily_prices.csv"
      - "data/monitoring_universe.csv"

permissions:
  contents: write

concurrency:
  group: candidate-coverage-report-${{ github.event.inputs.report_ref || github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select report target ref
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.report_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_ref="$INPUT_REF"
          else
            target_ref="main"
          fi
          if [[ ! "$target_ref" =~ ^[A-Za-z0-9._/-]+$ || "$target_ref" == *".."* || "$target_ref" == */ ]]; then
            echo "Invalid report_ref: $target_ref" >&2
            exit 1
          fi
          echo "ref=$target_ref" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Regenerate and commit reports with race-safe retry
        shell: bash
        env:
          TARGET_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Report commit attempt $attempt/5 for $TARGET_REF"
            git fetch origin "$TARGET_REF"
            git reset --hard "origin/$TARGET_REF"

            python candidate_coverage_audit.py
            python candidate_identity_evidence_audit.py
            python candidate_market_cap_reconciliation.py
            python candidate_review_queue.py
            python candidate_provider_observation_audit.py

            git add data/stock_candidate_coverage_report.csv data/candidate_identity_evidence_coverage.csv data/candidate_market_cap_reconciliation.csv data/candidate_review_queue.csv data/candidate_review_queue_summary.csv data/candidate_provider_observation_audit.csv
            if git diff --cached --quiet; then
              echo "Candidate reports already current on $TARGET_REF."
              exit 0
            fi

            git commit -m "Refresh pending candidate coverage report"
            if git push origin "HEAD:$TARGET_REF"; then
              echo "Candidate reports committed successfully to $TARGET_REF."
              exit 0
            fi

            echo "Concurrent $TARGET_REF update detected; regenerate from latest $TARGET_REF and retry."
            sleep "$((attempt * 2))"
          done

          echo "Could not publish reports after 5 retries." >&2
          exit 1
