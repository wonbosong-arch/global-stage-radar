name: Candidate coverage report

on:
  schedule:
    # 08:00 KST Monday-Saturday report-only freshness audit; this workflow does not fetch market prices.
    # Also rerun on report-workflow edits so the saved review snapshot can be reconciled immediately.
    - cron: "0 23 * * 0-5"
  workflow_dispatch:
  workflow_run:
    workflows: ["Manual pending-candidate price review v5", "Candidate stock discovery"]
    types: [completed]
    branches: ["data-validation-mvp"]
  push:
    branches: ["data-validation-mvp"]
    paths:
      - ".github/workflows/candidate_coverage_report.yml"
      - "candidate_coverage_audit.py"
      - "provisional_candidate_stage.py"
      - "stage_engine.py"
      - "tests/test_provisional_candidate_stage.py"
      - "stock_mapping.py"
      - "candidate_identity_evidence_audit.py"
      - "candidate_market_cap_reconciliation.py"
      - "candidate_review_queue.py"
      - "candidate_provider_observation_audit.py"
      - "china_candidate_screening_review.py"
      - "tests/test_china_candidate_screening_review.py"
      - "data/china_candidate_prices.csv"
      - "data/china_candidate_prices_status.json"
      - "yahoo_market_cap_supplement.py"
      - "yahoo_market_cap_reconciliation.py"
      - "tests/test_yahoo_market_cap_supplement.py"
      - "tests/test_yahoo_market_cap_reconciliation.py"
      - "collect_stock_candidates.py"
      - "data/adr_ratio_primary_source_registry.csv"
      - "data/issuer_country_evidence_review.csv"
      - "tests/test_adr_ratio_evidence.py"
      - "tests/test_candidate_provider_observation_audit.py"
      - "tests/test_candidate_review_queue.py"
      - "data/stock_universe_candidates.csv"
      - "data/candidate_daily_prices.csv"
      - "data/candidate_daily_prices_status.json"
      - "data/daily_prices.csv"
      - "data/monitoring_universe.csv"

permissions:
  contents: write

concurrency:
  group: candidate-coverage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Regenerate and commit reports with race-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Report commit attempt $attempt/5"
            git fetch origin data-validation-mvp
            git reset --hard origin/data-validation-mvp

            # Yahoo Finance provides a coarse $1B size-screen estimate only; it is not price/Stage input or formal cap verification.
            python yahoo_market_cap_supplement.py
            python candidate_coverage_audit.py
            # This is a review-only analysis; it never edits the approved monitoring universe.
            python provisional_candidate_stage.py
            python candidate_identity_evidence_audit.py
            python yahoo_market_cap_reconciliation.py
            python candidate_market_cap_reconciliation.py
            python candidate_review_queue.py
            python candidate_provider_observation_audit.py
            # China local ETF Stage/RS screen is review-only and never activates candidates.
            python china_candidate_screening_review.py

            git add data/china_candidate_screening_review.csv data/stock_candidate_coverage_report.csv data/provisional_candidate_stage_report.csv data/candidate_identity_evidence_coverage.csv data/candidate_market_cap_reconciliation.csv data/candidate_review_queue.csv data/candidate_review_queue_summary.csv data/sector_benchmark_review_batches.csv data/sector_benchmark_candidate_review.csv data/candidate_provider_observation_audit.csv data/yahoo_market_cap_supplement.csv data/yahoo_market_cap_reconciliation.csv
            if git diff --cached --quiet; then
              echo "Candidate reports already current."
              exit 0
            fi

            git commit -m "Refresh pending candidate coverage report"
            if git push origin HEAD:data-validation-mvp; then
              echo "Candidate reports committed successfully."
              exit 0
            fi

            echo "Concurrent target-branch update detected; regenerate from latest target branch and retry."
            sleep "$((attempt * 2))"
          done

          echo "Could not publish reports after 5 retries." >&2
          exit 1