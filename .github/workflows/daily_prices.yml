name: Daily closing-price snapshot

on:
  schedule:
    # 08:00 KST Monday-Saturday = 23:00 UTC Sunday-Friday; skip Sunday KST.
    - cron: "0 23 * * 0-5"
  workflow_dispatch:
  # Refresh after workflow or monitoring-universe changes.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/daily_prices.yml"
      - "data/monitoring_universe.csv"
      - "data_providers.py"
      - "kis_provider.py"
      - "refresh_daily_prices.py"

permissions:
  contents: write

concurrency:
  group: daily-closing-price-snapshot
  # A newer configuration or universe change should not wait behind a stale run.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch latest daily bars
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_daily_prices.py
      - name: Build offline candidate coverage report
        run: python candidate_coverage_audit.py
      - name: Commit updated snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily_prices.csv data/daily_prices_status.json data/stock_candidate_coverage_report.csv
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; no commit needed."
          else
            git commit -m "Refresh daily closing-price snapshot"
            # Other commits (for example, universe/test updates) can land while prices
            # are being fetched. Rebase the snapshot commit before pushing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
