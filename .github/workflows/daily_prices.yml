name: Daily closing-price snapshot

on:
  schedule:
    # 08:00 KST Monday-Saturday = 23:00 UTC Sunday-Friday; skip Sunday KST.
    - cron: "0 22 * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-closing-price-snapshot
  # Share the KIS serialization group with candidate collection and candidate-price refresh.
  # Never cancel an in-flight KIS request batch: later jobs should wait their turn so
  # rate-limited price collection and candidate discovery are not interrupted.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch latest daily bars
        id: refresh_prices
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_daily_prices.py
      - name: Publish price-refresh summary and symbol-level warnings
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh_prices.outcome }}
        run: |
          if [ ! -f data/daily_prices_status.json ]; then
            echo "## Daily price refresh" >> "$GITHUB_STEP_SUMMARY"
            echo "No status file was produced; inspect the refresh step logs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if os.environ.get("REFRESH_OUTCOME") != "success":
              with summary.open("a", encoding="utf-8") as out:
                  out.write("## Daily price refresh\n\n")
                  out.write(f"- Refresh step outcome: **{os.environ.get('REFRESH_OUTCOME', 'unknown')}**\n")
                  out.write("- This run did not produce a confirmed fresh status; any saved status file may be from an earlier run.\n")
              raise SystemExit(0)

          status = json.loads(Path("data/daily_prices_status.json").read_text(encoding="utf-8"))
          requested = status.get("requested_symbols", 0)
          fresh = len(status.get("fresh_data_symbols", []))
          available = status.get("symbols_with_data", 0)
          errors = status.get("errors", [])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## Daily price refresh\n\n")
              out.write(f"- Updated (KST): {status.get('updated_at_kst', 'unknown')}\n")
              out.write(f"- Fresh symbols: {fresh}/{requested}\n")
              out.write(f"- Symbols with saved data: {available}/{requested}\n")
              out.write(f"- Request errors: {len(errors)}\n")
              if errors:
                  out.write("\n### Symbols needing attention\n\n")
                  for item in errors:
                      symbol = str(item.get("symbol", "unknown")).replace("|", "\\|")
                      exchange = str(item.get("exchange", "")).replace("|", "\\|")
                      error = str(item.get("error", "unknown error")).replace("|", "\\|")
                      out.write(f"- **{symbol}** ({exchange}): {error}\n")
          PY
      - name: Build offline candidate coverage report from latest active and review-only snapshots
        run: python candidate_coverage_audit.py
      - name: Commit updated snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The coverage audit writes this report in the same run; stage it too so
          # the working tree is clean before rebasing over concurrent workflow commits.
          git add data/daily_prices.csv data/daily_prices_status.json data/stock_candidate_coverage_report.csv
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; no commit needed."
          else
            git commit -m "Refresh daily closing-price snapshot"
            # A metadata commit can land while prices are being fetched.
            # Retry against the latest target branch rather than failing on a non-fast-forward push.
            for attempt in 1 2 3 4 5; do
              git fetch origin data-validation-mvp
              # The candidate coverage report is also written by other scheduled
              # jobs. Prefer this run's generated snapshot/report during a conflict,
              # then regenerate the report against the rebased branch before pushing.
              if ! git rebase -X theirs origin/data-validation-mvp; then
                git rebase --abort || true
                echo "Concurrent rebase conflict outside the generated report; retrying ($attempt/5)."
                sleep "$((attempt * 2))"
                continue
              fi
              python candidate_coverage_audit.py
              git add data/stock_candidate_coverage_report.csv
              git commit --amend --no-edit
              if git push origin HEAD:data-validation-mvp; then
                echo "Daily snapshot committed successfully."
                exit 0
              fi
              echo "Concurrent target-branch update; retrying push ($attempt/5)."
              sleep "$((attempt * 2))"
            done
            echo "Could not publish daily snapshot after 5 retries." >&2
            exit 1
          fi
