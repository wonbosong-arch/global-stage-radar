name: Daily closing-price snapshot

on:
  push:
    branches:
      - data-validation-mvp
    paths:
      - "data/monitoring_universe.csv"
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: Scheduled UTC time supplied by the Cloudflare Worker
        required: false
        type: string

  workflow_call:
    inputs:
      scheduled_at:
        required: true
        type: string
      japan_close:
        required: true
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  # The Japan workflow holds the shared queue for both of its snapshots.
  group: ${{ inputs.japan_close && format('japan-operating-{0}', github.run_id) || 'daily-closing-price-snapshot' }}
  queue: max
  # Share the KIS serialization group with candidate collection and candidate-price refresh.
  # Never cancel an in-flight KIS request batch: later jobs should wait their turn so
  # rate-limited price collection and candidate discovery are not interrupted.
  cancel-in-progress: false

jobs:
  refresh:
    outputs:
      scheduled_slot: ${{ steps.scheduled_collection.outputs.scheduled_slot }}
      weekly: ${{ steps.scheduled_collection.outputs.weekly }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check whether the scheduled collection is already saved
        id: scheduled_collection
        env:
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: python automation/check_scheduled_daily_prices.py ${{ inputs.japan_close && '--japan-operating' || '--operating' }}
      - name: Install dependencies
        if: steps.scheduled_collection.outputs.skip != 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch latest daily bars
        if: steps.scheduled_collection.outputs.skip != 'true'
        id: refresh_prices
        env:
          JAPAN_CLOSE: ${{ inputs.japan_close }}
          SCHEDULED_SLOT: ${{ steps.scheduled_collection.outputs.scheduled_slot }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_daily_prices.py
      - name: Publish price-refresh summary and symbol-level warnings
        if: always() && steps.scheduled_collection.outputs.skip != 'true' && steps.refresh_prices.outputs.closed != 'true'
        env:
          JAPAN_CLOSE: ${{ inputs.japan_close }}
          REFRESH_OUTCOME: ${{ steps.refresh_prices.outcome }}
        run: |
          export PRICE_STATUS_PATH=data/daily_prices_status.json
          if [ "$JAPAN_CLOSE" = true ]; then
            export PRICE_STATUS_PATH=data/japan_operating_prices_status.json
          fi
          if [ ! -f "$PRICE_STATUS_PATH" ]; then
            echo "## Daily price refresh" >> "$GITHUB_STEP_SUMMARY"
            echo "No status file was produced; inspect the refresh step logs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if os.environ.get("REFRESH_OUTCOME") != "success":
              with summary.open("a", encoding="utf-8") as out:
                  out.write("## Daily price refresh\n\n")
                  out.write(f"- Refresh step outcome: **{os.environ.get('REFRESH_OUTCOME', 'unknown')}**\n")
                  out.write("- This run did not produce a confirmed fresh status; any saved status file may be from an earlier run.\n")
              raise SystemExit(0)

          status = json.loads(Path(os.environ["PRICE_STATUS_PATH"]).read_text(encoding="utf-8"))
          requested = status.get("requested_symbols", 0)
          fresh = len(status.get("fresh_data_symbols", []))
          available = status.get("symbols_with_data", 0)
          errors = status.get("errors", [])
          scheduled_complete = status.get("scheduled_completed_symbols")
          with summary.open("a", encoding="utf-8") as out:
              out.write("## Daily price refresh\n\n")
              out.write(f"- Updated (KST): {status.get('updated_at_kst', 'unknown')}\n")
              out.write(f"- Fresh symbols: {fresh}/{requested}\n")
              out.write(f"- Symbols with saved data: {available}/{requested}\n")
              if scheduled_complete is not None:
                  out.write(f"- Scheduled closes saved: {len(scheduled_complete)}/{requested}\n")
              out.write(f"- Request errors: {len(errors)}\n")
              if errors:
                  out.write("\n### Symbols needing attention\n\n")
                  for item in errors:
                      symbol = str(item.get("symbol", "unknown")).replace("|", "\\|")
                      exchange = str(item.get("exchange", "")).replace("|", "\\|")
                      error = str(item.get("error", "unknown error")).replace("|", "\\|")
                      out.write(f"- **{symbol}** ({exchange}): {error}\n")
          PY
      - name: Commit updated snapshot when changed
        id: publish
        if: steps.scheduled_collection.outputs.skip != 'true' && steps.refresh_prices.outputs.closed != 'true'
        env:
          JAPAN_CLOSE: ${{ inputs.japan_close }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$JAPAN_CLOSE" = true ]; then
            git add data/daily_prices.csv data/japan_operating_prices_status.json
          else
            git add data/daily_prices.csv data/daily_prices_status.json
          fi
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; no commit needed."
          else
            git commit -m "Refresh daily closing-price snapshot"
            # A metadata commit can land while prices are being fetched.
            # Retry against the latest target branch rather than failing on a non-fast-forward push.
            for attempt in 1 2 3 4 5; do
              git fetch origin data-validation-mvp
              if ! git rebase origin/data-validation-mvp; then
                git rebase --abort || true
                echo "Concurrent snapshot update; retrying ($attempt/5)."
                sleep "$((attempt * 2))"
                continue
              fi
              if git push origin HEAD:data-validation-mvp; then
                echo "Daily snapshot committed successfully."
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Concurrent target-branch update; retrying push ($attempt/5)."
              sleep "$((attempt * 2))"
            done
            echo "Could not publish daily snapshot after 5 retries." >&2
            exit 1
          fi

      - name: Request coverage report after publishing snapshots
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run candidate_coverage_report.yml --ref data-validation-mvp

      - name: Report incomplete scheduled close after saving available prices
        if: steps.refresh_prices.outputs.incomplete == 'true'
        run: |
          echo "::error::The scheduled snapshot is incomplete. Retry the failed job with the same scheduled slot."
          exit 1

  research:
    # A failure in the operating refresh must not discard the research collection.
    needs: refresh
    if: ${{ !cancelled() && !inputs.japan_close && needs.refresh.outputs.scheduled_slot != '' }}
    uses: ./.github/workflows/candidate_prices_manual.yml
    with:
      scheduled_at: ${{ needs.refresh.outputs.scheduled_slot }}
      parent_holds_queue: true
    secrets: inherit

  weekly-discovery:
    needs: [refresh, research]
    if: ${{ !cancelled() && needs.refresh.outputs.weekly == 'true' }}
    uses: ./.github/workflows/candidate_collection.yml
    with:
      scheduled: true
      parent_holds_queue: true
    secrets: inherit

  weekly-market-caps:
    needs: [refresh, weekly-discovery]
    if: ${{ !cancelled() && needs.refresh.outputs.weekly == 'true' }}
    uses: ./.github/workflows/yahoo_master_cap_batch.yml
    with:
      mode: supplement
