name: Unit tests and syntax validation

on:
  push:
    branches: ["main"]
    paths:
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "data/stock_candidate_coverage_report.csv"
      - "data/candidate_identity_evidence_coverage.csv"
      - "data/candidate_market_cap_reconciliation.csv"
      - "data/candidate_review_queue.csv"
      - "data/candidate_review_queue_summary.csv"
      - "data/candidate_provider_observation_audit.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
