name: Manual pending-candidate price review v5

on:
  schedule:
    # 08:05 KST Monday-Saturday; follows the main 08:00 KST snapshot.
    - cron: "5 23 * * 0-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/candidate_prices_manual.yml"
      - "candidate_coverage_audit.py"

permissions:
  contents: write

concurrency:
  group: daily-closing-price-snapshot
  cancel-in-progress: false

jobs:
  refresh-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch pending candidate history into isolated snapshot
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_candidate_prices.py
      - name: Record failure details if refresh did not create a status file
        if: always()
        run: |
          if [ ! -f data/candidate_daily_prices_status.json ]; then
            python - <<'PY'
            import json
            from datetime import datetime, timezone
            from pathlib import Path
            try:
                import pandas as pd
                candidates = pd.read_csv("data/stock_universe_candidates.csv")
                requested = int(len(candidates))
            except Exception:
                requested = None
            status = {
                "updated_at_utc": datetime.now(timezone.utc).isoformat(),
                "requested_symbols": requested,
                "symbols_with_data": 0,
                "error_count": 1,
                "errors": [{"symbol": "*", "error": "refresh_failed_before_status_write; inspect GitHub Actions logs"}],
                "data_note": "Diagnostic fallback only; no candidate activation."
            }
            Path("data/candidate_daily_prices_status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
            PY
          fi
      - name: Build candidate coverage report
        if: always()
        run: python candidate_coverage_audit.py
      - name: Commit review snapshot and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_candidate_coverage_report.csv
          for file in data/candidate_daily_prices.csv data/candidate_daily_prices_status.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No candidate review files changed."
          else
            git commit -m "Record pending candidate review result"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
