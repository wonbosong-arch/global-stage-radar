name: Manual pending-candidate price review v5

on:
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: Scheduled UTC time supplied by the Cloudflare Worker
        required: false
        type: string
      refresh_budget_seconds:
        description: '처리 예산: 900초 일반 수집 / 1초 기존 이력 정리 우선'
        type: choice
        required: false
        default: '900'
        options: ['900', '1']

  workflow_call:
    inputs:
      scheduled_at:
        required: true
        type: string
      refresh_budget_seconds:
        type: string
        default: '900'
      parent_holds_queue:
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  # The parent keeps the shared lock across the whole morning sequence.
  group: ${{ inputs.parent_holds_queue && format('candidate_prices_manual-{0}', github.run_id) || 'daily-closing-price-snapshot' }}
  queue: max
  cancel-in-progress: false

jobs:
  refresh-candidates:
    runs-on: ubuntu-latest
    # A full scheduled pass needs about 94 minutes at the observed 380 symbols/15 min.
    timeout-minutes: ${{ inputs.scheduled_at != '' && 120 || 30 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check whether the scheduled collection is already saved
        id: scheduled_collection
        env:
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: python automation/check_scheduled_daily_prices.py --candidate
      - name: Install dependencies
        if: steps.scheduled_collection.outputs.skip != 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch provisional Korean sector ETF benchmark history
        if: steps.scheduled_collection.outputs.skip != 'true'
        id: refresh_benchmarks
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_sector_benchmark_prices.py
      - name: Fetch pending candidate history into isolated snapshot
        if: steps.scheduled_collection.outputs.skip != 'true'
        id: refresh
        env:
          # Leave 15 minutes for setup, benchmark requests and publishing.
          # Manual/discovery-triggered runs keep their existing short budgets.
          CANDIDATE_SCHEDULED_SLOT: ${{ steps.scheduled_collection.outputs.scheduled_slot }}
          CANDIDATE_REFRESH_BUDGET_SECONDS: ${{ inputs.scheduled_at != '' && '6300' || inputs.refresh_budget_seconds || '900' }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_candidate_prices.py
      - name: Record failure details when candidate refresh fails
        if: always() && steps.scheduled_collection.outcome == 'success' && steps.scheduled_collection.outputs.skip != 'true'
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            # Replace stale status after failure so a prior success is not mistaken for this attempt.
            python - <<'PY'
          from pathlib import Path
          from candidate_refresh_state import record_refresh_failure
          record_refresh_failure(
              Path("data/candidate_daily_prices.csv"),
              Path("data/candidate_daily_prices_status.json"),
          )
          PY
          else
            echo "Candidate refresh succeeded; keeping the status written by refresh_candidate_prices.py."
          fi
      - name: Commit review snapshot and diagnostics
        id: publish
        if: always() && steps.scheduled_collection.outcome == 'success' && steps.scheduled_collection.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data/candidate_daily_prices.csv data/candidate_daily_prices_status.json data/sector_benchmark_candidate_prices.csv data/sector_benchmark_candidate_prices_status.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No candidate review files changed."
          else
            git commit -m "Record pending candidate review result"
            # Retry a non-fast-forward push if metadata/docs changed during the fetch.
            for attempt in 1 2 3 4 5; do
              git fetch origin data-validation-mvp
              git rebase origin/data-validation-mvp
              if git push origin HEAD:data-validation-mvp; then
                echo "Candidate review result committed successfully."
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Concurrent target-branch update; retrying push ($attempt/5)."
              sleep "$((attempt * 2))"
            done
            echo "Could not publish candidate review result after 5 retries." >&2
            exit 1
          fi

      - name: Request coverage report after publishing snapshots
        if: always() && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run candidate_coverage_report.yml --ref data-validation-mvp

      - name: Report incomplete scheduled close after saving available prices
        if: steps.refresh.outputs.incomplete == 'true'
        run: |
          echo "::error::The scheduled snapshot is incomplete. Retry the failed job with the same scheduled slot."
          exit 1
