name: Yahoo secondary market-cap inventory batch

on:
  schedule:
    # 10:00 KST weekdays; capped, resumable market-cap-only inventory scan.
    - cron: "0 1 * * 1-5"
  push:
    branches: ["data-validation-mvp"]
    paths:
      - ".github/workflows/yahoo_master_cap_batch.yml"
      - "yahoo_master_cap_batch.py"
      - "data/yahoo_unranked_master_market_caps.csv"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum symbols to query in this run (keep at or below 100)"
        required: false
        default: "50"
        type: string

permissions:
  contents: write

concurrency:
  group: yahoo-master-market-cap-batch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Collect bounded market-cap observations
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '50' }}
        run: python yahoo_master_cap_batch.py --batch-size "$BATCH_SIZE"
      - name: Commit secondary observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo_unranked_master_market_caps.csv data/yahoo_master_cap_triage.csv
          if git diff --cached --quiet; then
            echo "No new market-cap observations or triage changes."
            exit 0
          fi
          git commit -m "Refresh Yahoo market-cap observations and triage queue"
          for attempt in 1 2 3 4 5; do
            git fetch origin data-validation-mvp
            git rebase origin/data-validation-mvp
            if git push origin HEAD:data-validation-mvp; then
              echo "Market-cap observations committed."
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Could not publish observations after 5 retries." >&2
          exit 1
