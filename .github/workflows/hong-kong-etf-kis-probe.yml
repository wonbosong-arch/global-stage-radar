name: CSI 300 ETF read-only KIS verification

on:
  push:
    branches: [verify/csi300-kis-readonly]
    paths: [.github/workflows/hong-kong-etf-kis-probe.yml]

permissions:
  contents: read

concurrency:
  group: daily-closing-price-snapshot
  queue: max
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'wonbosong-arch/global-stage-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing project dependencies
        run: pip install -r requirements.txt
      - name: Verify 510300 identity and completed adjusted price history
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python hong_kong_etf_research.py --mainland-benchmark-only
      - name: Verify repository data files were untouched
        if: always()
        run: git diff --exit-code HEAD -- data/
