name: Daily crypto closing-price snapshot

on:
  push:
    branches: ["data-validation-mvp"]
    paths:
      - "data/crypto_asset_registry.csv"
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: Scheduled UTC time supplied by the Cloudflare Worker
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: crypto-closing-price-snapshot
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check whether the scheduled collection is already saved
        id: scheduled_collection
        env:
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: python automation/check_scheduled_daily_prices.py --crypto
      - name: Install dependencies
        if: steps.scheduled_collection.outputs.skip != 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch completed BTC and ETH daily candles
        id: refresh_prices
        if: steps.scheduled_collection.outputs.skip != 'true'
        env:
          SCHEDULED_SLOT: ${{ steps.scheduled_collection.outputs.scheduled_slot }}
        run: python refresh_crypto_prices.py
      - name: Commit crypto snapshot when changed
        if: steps.scheduled_collection.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto_daily_prices.csv data/crypto_daily_prices_status.json
          if git diff --cached --quiet; then
            echo "No crypto snapshot changes to commit."
            exit 0
          fi
          git commit -m "Refresh BTC and ETH daily price snapshot"
          # Other workflows can commit to the same branch while the candle batch runs.
          # Retry against the newest branch head to avoid a transient non-fast-forward failure.
          for attempt in 1 2 3 4 5; do
            git fetch origin data-validation-mvp
            if ! git rebase origin/data-validation-mvp; then
              git rebase --abort || true
              echo "Concurrent update conflict; retrying ($attempt/5)." >&2
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:data-validation-mvp; then
              echo "Crypto snapshot committed successfully."
              exit 0
            fi
            echo "Concurrent target-branch update; retrying ($attempt/5)." >&2
            sleep "$((attempt * 2))"
          done
          echo "Could not publish crypto snapshot after 5 retries." >&2
          exit 1

      - name: Report incomplete scheduled close after saving available prices
        if: steps.refresh_prices.outputs.incomplete == 'true'
        run: |
          echo "::error::The scheduled snapshot is incomplete. Retry the failed job with the same scheduled slot."
          exit 1
