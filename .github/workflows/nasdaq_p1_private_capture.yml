name: One-time encrypted Nasdaq P1 history capture

on:
  push:
    branches: [data-validation-mvp]
    paths: [.github/workflows/nasdaq_p1_private_capture.yml]

permissions:
  contents: read

concurrency:
  group: daily-closing-price-snapshot
  queue: max
  cancel-in-progress: false

jobs:
  capture:
    if: github.repository == 'wonbosong-arch/global-stage-radar' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d09ca465bb8ac1677f596708618b89a4fd407996
          path: nasdaq-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Retain bounded ticker and normalized history linkage as ciphertext only
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          mkdir -p "$RUNNER_TEMP/p1-capture"
          python nasdaq_p1_kis_history_probe.py \
            --nasdaq-csv nasdaq-source/data/nasdaq_manual_screener/latest.csv \
            --receipt nasdaq-source/data/nasdaq_manual_screener/latest.json \
            --max-symbols 16 --max-pages 3 --pause-seconds 2 --execute \
            --recipient-key docs/evidence/us-p1-review-recipient-20261112.pem \
            --encrypted-output "$RUNNER_TEMP/p1-capture/history.enc.json"
      - name: Preserve only encrypted review evidence for seven days
        uses: actions/upload-artifact@v4
        with:
          name: p1-encrypted-history-${{ github.run_id }}
          path: ${{ runner.temp }}/p1-capture/history.enc.json
          if-no-files-found: error
          retention-days: 7
      - name: Confirm no tracked repository data changed
        if: always()
        run: |
          git diff --exit-code -- data/
          git diff --cached --exit-code -- data/
