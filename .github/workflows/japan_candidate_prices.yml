name: Japan sector ETF candidate price observation

on:
  push:
    branches: ["data-validation-mvp"]
    paths:
      - ".github/workflows/japan_candidate_prices.yml"
      - "refresh_japan_candidate_prices.py"
      - "data_providers.py"
      - "kis_provider.py"
  schedule:
    # 08:00 KST Monday-Saturday, aligned with the active daily closing-price refresh.
    - cron: "0 22 * * 0-5"

permissions:
  contents: write

concurrency:
  group: daily-closing-price-snapshot
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: data-validation-mvp
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch only the seven inactive Japan-listed candidates
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python refresh_japan_candidate_prices.py
      - name: Commit isolated observation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan_candidate_prices.csv data/japan_candidate_prices_status.json
          if git diff --cached --quiet; then
            echo "Japan candidate observation unchanged."
            exit 0
          fi
          git commit -m "Refresh isolated Japan ETF candidate price observations"
          for attempt in 1 2 3 4 5; do
            git fetch origin data-validation-mvp
            if ! git rebase origin/data-validation-mvp; then
              git rebase --abort || true
              echo "Concurrent update conflict; retrying ($attempt/5)."
              sleep "$((attempt * 2))"
              continue
            fi
            if git push origin HEAD:data-validation-mvp; then
              echo "Japan candidate observation committed."
              exit 0
            fi
            echo "Concurrent target-branch update; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "Could not publish Japan candidate observation after 5 retries." >&2
          exit 1
