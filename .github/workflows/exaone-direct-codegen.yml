name: EXAONE direct regression-test codegen

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Explicitly approve ONE EXAONE API request (default offline)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: exaone-direct-codegen
  cancel-in-progress: false

jobs:
  generate-candidate:
    if: ${{ !inputs.live || github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source, without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate fixed prompt and source excerpt offline
        run: python -X utf8 automation/exaone-opencode-poc/direct_codegen.py --check-only

      - name: Generate review-only code in one API request (no model tools)
        if: ${{ inputs.live }}
        shell: bash
        env:
          EXAONE_API_KEY: ${{ secrets.EXAONE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$EXAONE_API_KEY"
          timeout 120s python -X utf8 automation/exaone-opencode-poc/direct_codegen.py \
            --workspace "$RUNNER_TEMP/exaone-direct-workspace" \
            --destination "$RUNNER_TEMP/exaone-direct-candidate"

      - name: Save only the unexecuted candidate source
        if: ${{ inputs.live && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: exaone-direct-unverified-candidate
          path: ${{ runner.temp }}/exaone-direct-candidate/test_exaone_sector_pilot_agent.py
          retention-days: 1
          if-no-files-found: error

  verify-behavior:
    name: Validate code in a separate no-secret, networkless runner
    needs: generate-candidate
    if: ${{ inputs.live && needs['generate-candidate'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download untrusted candidate
        uses: actions/download-artifact@v4
        with:
          name: exaone-direct-unverified-candidate
          path: ${{ runner.temp }}/exaone-direct-output

      - name: Prepare only source needed for verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exaone-direct-review/tests/fixtures"
          cp -- "$RUNNER_TEMP/exaone-direct-output/test_exaone_sector_pilot_agent.py" \
            "$RUNNER_TEMP/exaone-direct-review/tests/test_exaone_sector_pilot_agent.py"
          cp -- exaone_sector_pilot.py stock_mapping.py "$RUNNER_TEMP/exaone-direct-review/"
          cp -- tests/fixtures/exaone_sector_samples.json \
            "$RUNNER_TEMP/exaone-direct-review/tests/fixtures/"

      - name: Run generated tests inside an isolated container
        shell: bash
        run: |
          set -euo pipefail
          # No API secret is available to this job. No network or writable source mounts.
          timeout 60s docker run --rm -i --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 256m --cpus 1 --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            -v "$RUNNER_TEMP/exaone-direct-review:/work:ro" \
            -v "$GITHUB_WORKSPACE/automation/exaone-opencode-poc/behavior_check.py:/verify/behavior_check.py:ro" \
            --workdir /work python:3.11-slim \
            python -I -B /verify/behavior_check.py --task exaone-regression-tests

      - name: Retain passing source for human review
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: exaone-direct-verified-code
          path: ${{ runner.temp }}/exaone-direct-output/test_exaone_sector_pilot_agent.py
          retention-days: 3
          if-no-files-found: error
