name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile application modules
        run: python -m py_compile app.py stage_engine.py kis_provider.py kis_domestic_provider.py kis_universe.py stock_mapping.py universe.py market_data.py data_providers.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
