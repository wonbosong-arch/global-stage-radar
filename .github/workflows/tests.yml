name: Python tests

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "data/stock_candidate_coverage_report.csv"
      - "data/candidate_identity_evidence_coverage.csv"
      - "data/candidate_market_cap_reconciliation.csv"
      - "data/candidate_review_queue.csv"
      - "data/candidate_review_queue_summary.csv"
      - "data/candidate_provider_observation_audit.csv"
  pull_request:
    paths-ignore:
      - "data/stock_candidate_coverage_report.csv"
      - "data/candidate_identity_evidence_coverage.csv"
      - "data/candidate_market_cap_reconciliation.csv"
      - "data/candidate_review_queue.csv"
      - "data/candidate_review_queue_summary.csv"
      - "data/candidate_provider_observation_audit.csv"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile application modules
        run: python -m py_compile app.py stage_engine.py kis_provider.py kis_domestic_provider.py kis_universe.py stock_mapping.py universe.py market_data.py data_providers.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
